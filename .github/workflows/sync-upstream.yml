name: Sync Upstream

on:
  schedule:
    - cron: '0 3 * * *' # 每天凌晨 3:00 自动检查原作者更新
  workflow_dispatch:     # 支持手动随时点击触发

permissions:
  contents: write

jobs:
  sync:
    name: Sync with Lessica/TrollFools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Upstream
        run: |
          git remote add upstream https://github.com/Lessica/TrollFools.git || true
          git fetch upstream
          git merge upstream/main -m "chore: sync upstream from Lessica/TrollFools" || echo "Already up to date or manual merge required"
          git push origin main || echo "Nothing to push"
